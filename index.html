<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AnaStudio - Text to Speech</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237b1e3a'/%3E%3Cpath d='M25 72 L50 18 L75 72 H61 L55 58 H45 L39 72 Z M48 46 L50 40 L52 46 Z' fill='white'/%3E%3C/svg%3E"
  />

  <!-- Library gratis untuk mengubah PCM menjadi MP3 -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      color: #7b1e3a;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
      color: #666;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .character-count {
      margin-top: 6px;
      text-align: right;
      font-size: 13px;
      color: #777;
    }

    .button-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button,
    .download-button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #7b1e3a;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .download-button {
      display: none;
      background: #176b45;
    }

    #status {
      margin-top: 18px;
      color: #555;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    audio {
      display: none;
      width: 100%;
      margin-top: 20px;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f8f1f4;
      color: #6b2940;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>AnaStudio</h1>

      <p class="subtitle">
        Ubah narasi menjadi suara MP3
      </p>

      <label for="modelSelect">
        Model AI
      </label>

      <select id="modelSelect">
        <option value="gemini-2.5-flash-preview-tts">
          Gemini 2.5 Flash Preview TTS
        </option>
      </select>

      <label for="voiceSelect">
        Suara Gemini
      </label>

      <select id="voiceSelect">
        <option value="Kore">Kore</option>
        <option value="Puck">Puck</option>
        <option value="Charon">Charon</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Aoede">Aoede</option>
      </select>

      <label for="styleInput">
        Preset Karakter Suara
      </label>

      <input
        type="text"
        id="styleInput"
        placeholder="Kosongkan untuk memakai suara pria dewasa yang ramah dan natural..."
      >

      <label for="textInput">
        Teks Narasi
      </label>

      <textarea
        id="textInput"
        maxlength="5000"
        placeholder="Tulis narasi yang ingin diubah menjadi suara..."
      >Halo, saya Naya. Selamat datang di AnaStudio.</textarea>

      <div class="character-count">
        <span id="characterCount">0</span> / 5000 karakter
      </div>

      <label for="fileNameInput">
        Nama File Audio
      </label>

      <input
        type="text"
        id="fileNameInput"
        placeholder="AnaAudio_01"
        maxlength="80"
      >

      <div class="button-area">
        <button id="generateButton">
          Generate MP3
        </button>

        <a
          id="downloadButton"
          class="download-button"
          download="AnaAudio_001.mp3"
        >
          Download MP3
        </a>
      </div>

      <div id="status"></div>

      <audio
        id="audioPlayer"
        controls
      ></audio>

      <div class="info">
        <strong>AnaStudio</strong><br>
        Fitur unggulan: Text-to-Speech, pilihan karakter suara, preset narasi,
        pemutar audio, dan ekspor MP3 langsung dari browser.
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL =
      "https://naya-tts-backend.vercel.app/api/generate";

    const textInput =
      document.getElementById("textInput");

    const styleInput =
      document.getElementById("styleInput");

    const voiceSelect =
      document.getElementById("voiceSelect");

    const modelSelect =
      document.getElementById("modelSelect");

    const generateButton =
      document.getElementById("generateButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const statusText =
      document.getElementById("status");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const characterCount =
      document.getElementById("characterCount");

    const fileNameInput =
      document.getElementById("fileNameInput");

    const defaultStyle =
      "Bacakan dengan suara pria dewasa yang ramah, natural, jelas, dan cocok untuk narasi status Facebook serta video affiliate.";

    let currentAudioUrl = null;

    textInput.addEventListener(
      "input",
      updateCharacterCount
    );

    generateButton.addEventListener(
      "click",
      generateVoice
    );

    updateCharacterCount();

    function updateCharacterCount() {
      characterCount.textContent =
        textInput.value.length;
    }

    async function generateVoice() {
      const text =
        textInput.value.trim();

      const voiceName =
        voiceSelect.value;

      const modelName =
        modelSelect.value;

      const customStyle =
        styleInput.value.trim();

      const voiceStyle =
        customStyle || defaultStyle;

      if (!text) {
        statusText.textContent =
          "Teks narasi belum diisi.";

        return;
      }

      generateButton.disabled = true;
      generateButton.textContent =
        "Sedang membuat MP3...";

      statusText.textContent =
        "Menghubungi Gemini TTS...";

      audioPlayer.style.display =
        "none";

      downloadButton.style.display =
        "none";

      if (currentAudioUrl) {
        URL.revokeObjectURL(
          currentAudioUrl
        );

        currentAudioUrl = null;
      }

      try {
        const response = await fetch(
          BACKEND_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              text:
                voiceStyle +
                "\n\nNarasi:\n" +
                text,

              voiceName: voiceName,

              modelName: modelName
            })
          }
        );

        const result =
          await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error ||
            "Gagal membuat audio."
          );
        }

        statusText.textContent =
          "Mengubah audio menjadi MP3...";

        const mp3Blob =
          convertBase64PcmToMp3(
            result.audioBase64,
            24000,
            1
          );

        currentAudioUrl =
          URL.createObjectURL(
            mp3Blob
          );

        audioPlayer.src =
          currentAudioUrl;

        audioPlayer.style.display =
          "block";

        downloadButton.href =
          currentAudioUrl;

        downloadButton.download =
          createFileName();

        downloadButton.style.display =
          "inline-block";

        statusText.textContent =
          "MP3 berhasil dibuat dan siap diputar.";

      } catch (error) {
        statusText.textContent =
          "Terjadi kesalahan: " +
          error.message;

      } finally {
        generateButton.disabled =
          false;

        generateButton.textContent =
          "Generate MP3";
      }
    }

    function convertBase64PcmToMp3(
      base64,
      sampleRate,
      channels
    ) {
      const binaryString =
        atob(base64);

      const pcmBytes =
        new Uint8Array(
          binaryString.length
        );

      for (
        let i = 0;
        i < binaryString.length;
        i++
      ) {
        pcmBytes[i] =
          binaryString.charCodeAt(i);
      }

      const pcm16 =
        new Int16Array(
          pcmBytes.buffer
        );

      const mp3Encoder =
        new lamejs.Mp3Encoder(
          channels,
          sampleRate,
          128
        );

      const mp3Data = [];

      const sampleBlockSize =
        1152;

      for (
        let i = 0;
        i < pcm16.length;
        i += sampleBlockSize
      ) {
        const sampleChunk =
          pcm16.subarray(
            i,
            i + sampleBlockSize
          );

        const mp3Buffer =
          mp3Encoder.encodeBuffer(
            sampleChunk
          );

        if (mp3Buffer.length > 0) {
          mp3Data.push(
            new Int8Array(mp3Buffer)
          );
        }
      }

      const finalBuffer =
        mp3Encoder.flush();

      if (finalBuffer.length > 0) {
        mp3Data.push(
          new Int8Array(finalBuffer)
        );
      }

      return new Blob(
        mp3Data,
        {
          type: "audio/mpeg"
        }
      );
    }

    function createFileName() {
      let fileName =
        fileNameInput.value.trim();

      if (!fileName) {
        fileName = "AnaAudio_01";
      }

      fileName = fileName
        .replace(/[\/:*?"<>|]/g, "")
        .trim();

      if (!fileName) {
        fileName = "AnaAudio_01";
      }

      if (!fileName.toLowerCase().endsWith(".mp3")) {
        fileName += ".mp3";
      }

      return fileName;
    }
  </script>
</body>
</html>
