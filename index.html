<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AnaStudio - Text to Speech</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7b1e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AnaStudio">
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237b1e3a'/%3E%3Cpath d='M25 72 L50 18 L75 72 H61 L55 58 H45 L39 72 Z M48 46 L50 40 L52 46 Z' fill='white'/%3E%3C/svg%3E"
  />

  <!-- Library gratis untuk mengubah PCM menjadi MP3 -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <div class="container">
    <div class="card">
      <h1>AnaStudio</h1>

      <p class="subtitle">
        Ubah narasi menjadi suara MP3
      </p>

      <label for="modelSelect">
        Model AI
      </label>

      <select id="modelSelect">
        <option value="gemini-2.5-flash-preview-tts">
          Gemini 2.5 Flash Preview TTS
        </option>
      </select>

      <label for="voiceSelect">
        Suara Gemini
      </label>

      <select id="voiceSelect">
        <option value="Kore">Kore</option>
        <option value="Puck">Puck</option>
        <option value="Charon">Charon</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Aoede">Aoede</option>
      </select>

      <label for="speedSelect">
        Kecepatan Bicara
      </label>

      <select id="speedSelect">
        <option value="1.0">Normal (1.0x)</option>
        <option value="1.2">Cepat (1.2x)</option>
        <option value="1.5">Sangat Cepat (1.5x)</option>
        <option value="0.8">Pelan (0.8x)</option>
      </select>

      <label for="characterSelect">
        Karakter Suara
      </label>

      <select id="characterSelect">
        <option value="ramah">Dewasa Ramah (Default)</option>
        <option value="anak">Suara Anak-anak</option>
        <option value="lansia">Suara Lansia</option>
        <option value="robot">Suara Robot/AI</option>
        <option value="tegas">Tegas/Otoriter</option>
      </select>

      <label for="styleInput">
        Preset Karakter Suara
      </label>

      <input
        type="text"
        id="styleInput"
        placeholder="Kosongkan untuk memakai suara pria dewasa yang ramah dan natural..."
      >

      <label for="textInput">
        Teks Narasi
      </label>

      <textarea
        id="textInput"
        maxlength="5000"
        placeholder="Tulis narasi yang ingin diubah menjadi suara..."
      >Halo, saya Naya. Selamat datang di AnaStudio.</textarea>

      <div class="character-count">
        <span id="characterCount">0</span> / 5000 karakter
      </div>

      <label for="fileNameInput">
        Nama File Audio
      </label>

      <input
        type="text"
        id="fileNameInput"
        placeholder="AnaAudio_01"
        maxlength="80"
      >

      <div class="button-area">
        <button id="generateButton">
          Generate MP3
        </button>

        <a
          id="downloadButton"
          class="download-button"
          download="AnaAudio_001.mp3"
        >
          Download MP3
        </a>
      </div>

      <div id="status"></div>

      <audio
        id="audioPlayer"
        controls
      ></audio>

      <div class="info">
        <strong>AnaStudio</strong><br>
        Fitur unggulan: Text-to-Speech, pilihan karakter suara, preset narasi,
        pemutar audio, dan ekspor MP3 langsung dari browser.
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>

</body>
</html>
